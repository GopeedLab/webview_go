name: CI Pipeline
on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Go 1.23 was the latest version as of 2024-08-31 but the action output a "warning":
        # Failed to restore: "/usr/bin/tar" failed with error: The process '/usr/bin/tar' failed with exit code 2
        # Go 1.22 didn't output the above "warning" so we're using this version.
        # Go 1.17 is the minimum supported version (runtime/cgo.Handle).
        include:
          - { image: macos-14, go: "1.22", native: true }
          - { image: macos-14, go: "1.21" }
          - { image: macos-14, go: "1.20" }
          # Go 1.19 is the earliest version available for ARM64.
          - { image: macos-14, go: "1.19" }
          # macos-15-intel runner has x86_64 support which is needed for old versions of Go
          - { image: macos-15-intel, go: "1.18" }
          - { image: macos-15-intel, go: "1.17" }
          - { image: ubuntu-22.04, go: "1.22", native: true, apt: libgtk-3-dev libwebkit2gtk-4.1-dev }
          - { image: ubuntu-22.04, go: "1.21", apt: libgtk-3-dev libwebkit2gtk-4.1-dev }
          - { image: ubuntu-22.04, go: "1.20", apt: libgtk-3-dev libwebkit2gtk-4.1-dev }
          - { image: ubuntu-22.04, go: "1.19", apt: libgtk-3-dev libwebkit2gtk-4.1-dev }
          - { image: ubuntu-22.04, go: "1.18", apt: libgtk-3-dev libwebkit2gtk-4.1-dev }
          - { image: ubuntu-22.04, go: "1.17", apt: libgtk-3-dev libwebkit2gtk-4.1-dev }
          - { image: windows-2022, go: "1.22", native: true }
          - { image: windows-2022, go: "1.21" }
          # Go 1.20 is the earliest version that is usable in this environment as of 2024-08-31.
          # Compilation fails with older versions:
          # [...]/bin/ld.exe: [...]\go-link-3209855222\000008.o: in function `x_cgo_thread_start':
          # \\_\_\runtime\cgo/gcc_util.c:18: undefined reference to `__imp___iob_func'
          - { image: windows-2022, go: "1.20" }
    name: Build (${{ matrix.image }}, go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }} xvfb
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build examples
        run: >
          go build -ldflags=-w ./examples/basic ./examples/bind
      - name: Run tests
        # Old Go linkers cannot merge DWARF emitted by current Apple linkers.
        # Keep their compile/runtime checks, without unused debug information.
        run: go test -ldflags=-w
      - name: Check queued binding response lifetime with AddressSanitizer
        if: matrix.native && runner.os == 'Linux'
        run: |
          g++ -std=c++11 -g -fsanitize=address tests/engine_lifetime.cc $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1) -ldl -o /tmp/webview-engine-lifetime
          /tmp/webview-engine-lifetime
      - name: Run native WebView integration tests
        if: matrix.native && runner.os == 'Linux'
        run: xvfb-run -a go test -tags webview_integration -v -count=1 -timeout 180s .
      - name: Run native WebView integration tests
        if: matrix.native && runner.os != 'Linux'
        run: go test -tags webview_integration -v -count=1 -timeout 180s .
